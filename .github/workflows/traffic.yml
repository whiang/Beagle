# Daily copy of the repository traffic (GitHub keeps 14 days) into traffic.json and of the web app
# visitors by country (GoatCounter) into goatcounter.json for stats.html.
# Secrets: TRAFFIC_TOKEN, a token that can read this repository's traffic (fine-grained token with
# "Administration: Read-only" on this repository); GC_TOKEN, a GoatCounter API token ("Read statistics").
name: traffic
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node traffic.mjs
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
      - run: node goatcounter.mjs
        env:
          GC_TOKEN: ${{ secrets.GC_TOKEN }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in traffic.json goatcounter.json; do if [ -f $f ]; then git add $f; fi; done
          git diff --cached --quiet || { git commit -m 'Update traffic' && git push; }
