# Daily copy of the repository traffic (GitHub keeps 14 days) into traffic.json for stats.html.
# Needs the secret TRAFFIC_TOKEN: a token that can read this repository's traffic
# (fine-grained token with "Administration: Read-only" on this repository).
name: traffic
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node traffic.mjs
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
      - run: |
          [ -f traffic.json ] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add traffic.json
          git diff --cached --quiet || { git commit -m 'Update traffic' && git push; }
