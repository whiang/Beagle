<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beagle 이용 통계</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2;
  --surface: #fcfcfb;
  --border: #e2e1dc;
  --grid: #ecebe7;
  --text: #0b0b0b;
  --text-2: #52514e;
  --muted: #7a7974;
  --accent: #2a78d6;
  --series-1: #2a78d6;
  --series-2: #eb6834;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110;
    --surface: #1a1a19;
    --border: #2e2e2c;
    --grid: #262625;
    --text: #f0efec;
    --text-2: #c3c2b7;
    --muted: #8f8e88;
    --accent: #3987e5;
    --series-1: #3987e5;
    --series-2: #d95926;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110;
  --surface: #1a1a19;
  --border: #2e2e2c;
  --grid: #262625;
  --text: #f0efec;
  --text-2: #c3c2b7;
  --muted: #8f8e88;
  --accent: #3987e5;
  --series-1: #3987e5;
  --series-2: #d95926;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 20px; }
h1 { font-size: 24px; margin: 0; }
h2 { font-size: 18px; margin: 0 0 4px; }
h3 { font-size: 14px; margin: 18px 0 6px; color: var(--text-2); font-weight: 600; }
a { color: var(--accent); }
.sub { color: var(--text-2); font-size: 13px; margin: 0 0 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 18px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 14px 0 6px; }
.tile { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.tile .v { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .k { font-size: 12.5px; color: var(--text-2); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
th { color: var(--text-2); font-weight: 600; }
.empty { color: var(--muted); font-size: 13.5px; padding: 18px 0; text-align: center; }
.note { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--bg); border-radius: 0 6px 6px 0; font-size: 13.5px; }
.note ol { margin: 6px 0 0; padding-left: 20px; }
/* follows the report canvas (1200 x 550 in Data Studio) plus its footer bar, so the report fills the box at any width */
#gaBody { container-type: inline-size; }
iframe { display: block; width: 100%; height: calc(100cqw * 550 / 1200 + 32px); min-height: 260px; border: 0; border-radius: 8px; background: var(--bg); }
td.bar { width: 32%; }
td.bar span { display: block; height: 8px; border-radius: 0 4px 4px 0; background: var(--series-1); min-width: 2px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.tip { position: absolute; top: 8px; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; font-size: 12.5px; box-shadow: 0 2px 8px rgb(0 0 0 / .12); white-space: nowrap; display: none; }
.tip b { display: block; margin-bottom: 2px; }
tr.region td:first-child { padding-left: 26px; color: var(--text-2); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Beagle 이용 통계</h1>
    <span class="sub"><a href="./">Beagle 웹 실행</a> · <a href="https://sites.google.com/view/beagle">홈페이지</a></span>
  </header>

  <section class="card" id="gc">
    <h2>웹앱 이용 (GoatCounter)</h2>
    <p class="sub">웹앱(whiang.github.io/Beagle)을 연 횟수와 국가입니다. 쿠키 없이 집계하며 측정 데이터는 보내지 않습니다 (1.1.1부터).</p>
    <div id="gcBody"><div class="empty">불러오는 중…</div></div>
    <p class="sub"><a href="https://whiang.goatcounter.com/">GoatCounter 대시보드 열기 →</a> (일별 추이, 유입 경로, 브라우저)</p>
  </section>

  <section class="card" id="ga">
    <h2>홈페이지 방문 (Google Analytics)</h2>
    <p class="sub">홈페이지(sites.google.com/view/beagle) 방문자 수와 지역</p>
    <div id="gaBody"></div>
  </section>
</main>

<script>
// Google Analytics: paste the embed URL of a Looker Studio report on the GA4 property
// (Looker Studio > Share > Embed report), e.g. https://lookerstudio.google.com/embed/reporting/<id>/page/<page>
const LOOKER_EMBED = 'https://datastudio.google.com/embed/reporting/e5e2421e-0613-43a0-995a-2b8128528987/page/F4aCG';

const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('ko-KR');
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  e.append(...kids);
  return e;
};

// ---------- Google Analytics ----------
if (LOOKER_EMBED) {
  $('gaBody').append(el('iframe', { src: LOOKER_EMBED, title: 'Google Analytics 보고서', loading: 'lazy', allowfullscreen: '' }));
} else {
  $('gaBody').innerHTML = `<div class="note">아직 연결되지 않았습니다. 연결 순서:
    <ol>
      <li><a href="https://analytics.google.com/">Google Analytics</a>에서 속성(웹 스트림: sites.google.com/view/beagle)을 만들고 측정 ID(G-…)를 복사</li>
      <li>Google Sites 편집 화면 → 설정(톱니) → 애널리틱스 → 측정 ID 입력 → 게시</li>
      <li><a href="https://lookerstudio.google.com/">Looker Studio</a>에서 그 속성으로 보고서를 만들고 공유 → 보고서 삽입의 URL을 이 페이지에 넣기</li>
    </ol></div>`;
}

// ---------- web app visitors per day: line chart with crosshair and tooltip ----------
const SVG = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs) => { const e = document.createElementNS(SVG, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };

// top of the y axis: 4 whole-number steps of 1, 2 or 5 x 10^k
function niceMax(v) {
  const raw = Math.max(1, v / 4), p = 10 ** Math.floor(Math.log10(raw)), m = raw / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p * 4;
}

// every calendar day from the start to the last update, missing days = 0
function fillDays(list, start, until) {
  const by = Object.fromEntries((list || []).map(d => [d.date, d.count]));
  const out = [], end = new Date(until.slice(0, 10) + 'T00:00:00Z');
  for (let d = new Date(start + 'T00:00:00Z'); d <= end; d.setUTCDate(d.getUTCDate() + 1)) {
    const k = d.toISOString().slice(0, 10);
    out.push({ date: k, count: by[k] || 0 });
  }
  return out;
}

function lineChart(days, W) {
  const H = 220, m = { l: 36, r: 24, t: 12, b: 28 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
  const max = niceMax(Math.max(1, ...days.map(d => d.count)));
  const x = i => m.l + (days.length === 1 ? pw / 2 : (i * pw) / (days.length - 1));
  const y = v => m.t + ph - (v / max) * ph;
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': '웹앱 일별 접속자' });
  for (let k = 0; k <= 4; k++) {
    const v = (max * k) / 4, yy = y(v);
    svg.append(svgEl('line', { x1: m.l, x2: m.l + pw, y1: yy, y2: yy, stroke: k ? 'var(--grid)' : 'var(--border)', 'stroke-width': 1 }));
    const t = svgEl('text', { x: m.l - 6, y: yy + 4, 'text-anchor': 'end' }); t.textContent = fmt(v); svg.append(t);
  }
  const step = Math.max(1, Math.ceil(days.length / Math.max(2, Math.floor(pw / 70))));
  days.forEach((d, i) => {
    if (i % step) return;
    const t = svgEl('text', { x: x(i), y: H - 8, 'text-anchor': 'middle' }); t.textContent = d.date.slice(5).replace('-', '/'); svg.append(t);
  });
  svg.append(svgEl('polyline', { points: days.map((d, i) => `${x(i).toFixed(1)},${y(d.count).toFixed(1)}`).join(' '), fill: 'none', stroke: 'var(--series-1)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  if (days.length === 1) svg.append(svgEl('circle', { cx: x(0), cy: y(days[0].count), r: 4, fill: 'var(--series-1)' }));
  const cross = svgEl('line', { y1: m.t, y2: m.t + ph, stroke: 'var(--muted)', 'stroke-width': 1, 'stroke-dasharray': '3 3', visibility: 'hidden' });
  const dot = svgEl('circle', { r: 4.5, fill: 'var(--series-1)', stroke: 'var(--surface)', 'stroke-width': 2, visibility: 'hidden' });
  const hit = svgEl('rect', { x: m.l, y: m.t, width: pw, height: ph, fill: 'transparent' });
  svg.append(cross, dot, hit);
  const tip = el('div', { class: 'tip' });
  hit.addEventListener('pointermove', ev => {
    const r = svg.getBoundingClientRect(), px = ((ev.clientX - r.left) / r.width) * W;
    const i = days.length === 1 ? 0 : Math.max(0, Math.min(days.length - 1, Math.round(((px - m.l) / pw) * (days.length - 1))));
    for (const [a, v] of [['x1', x(i)], ['x2', x(i)], ['visibility', 'visible']]) cross.setAttribute(a, v);
    for (const [a, v] of [['cx', x(i)], ['cy', y(days[i].count)], ['visibility', 'visible']]) dot.setAttribute(a, v);
    tip.replaceChildren(el('b', {}, days[i].date), `접속자 ${fmt(days[i].count)}`);
    tip.style.display = 'block';
    const left = (x(i) / W) * r.width;
    tip.style.left = `${left + 12 + tip.offsetWidth > r.width ? left - tip.offsetWidth - 12 : left + 12}px`;
  });
  hit.addEventListener('pointerleave', () => { tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); });
  return el('div', { class: 'chart' }, svg, tip);
}

// ---------- web app visitors by country / region (GoatCounter, goatcounter.json) ----------
function renderGc(data) {
  const total = data.total || data.countries.reduce((s, c) => s + c.count, 0);
  const pct = n => (total ? ((n / total) * 100).toFixed(1) + '%' : '-');
  const max = Math.max(1, ...data.countries.map(c => c.count));
  const row = (name, n, cls) => el('tr', cls ? { class: cls } : {},
    el('td', {}, name), el('td', { class: 'n' }, fmt(n)), el('td', { class: 'n' }, pct(n)),
    el('td', { class: 'bar' }, el('span', { style: `width:${(n / max) * 100}%` })));
  const body = el('tbody');
  for (const c of [...data.countries].sort((a, b) => b.count - a.count)) {
    body.append(row(c.name, c.count));
    for (const r of [...(c.regions || [])].sort((a, b) => b.count - a.count)) body.append(row(r.name, r.count, 'region'));
  }
  const t = el('table', { 'aria-label': '국가·지역별 접속자' },
    el('thead', {}, el('tr', {}, el('th', {}, '국가 / 지역'), el('th', { class: 'n' }, '접속자'), el('th', { class: 'n' }, '비율'), el('th', {}, ''))), body);
  const days = fillDays(data.daily, data.start, data.updated), chartBox = el('div');
  let lastW = 0;
  const draw = () => { const w = Math.max(280, chartBox.clientWidth || 960); if (w !== lastW) { lastW = w; chartBox.replaceChildren(lineChart(days, w)); } };
  $('gcBody').replaceChildren(
    el('div', { class: 'tiles' },
      el('div', { class: 'tile' }, el('div', { class: 'v' }, fmt(total)), el('div', { class: 'k' }, '누적 접속자')),
      el('div', { class: 'tile' }, el('div', { class: 'v' }, fmt(data.countries.length)), el('div', { class: 'k' }, '국가 수'))),
    ...(data.daily ? [el('h3', {}, '일별 접속자'), chartBox] : []),
    el('h3', {}, `국가·지역별 접속자 (${data.start} 이후, 갱신 ${new Date(data.updated).toLocaleString('ko-KR')})`),
    data.countries.length ? t : el('div', { class: 'empty' }, '아직 접속 기록이 없습니다'));
  if (data.daily) { draw(); addEventListener('resize', draw); }
}
fetch('goatcounter.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(renderGc)
  .catch(() => { $('gcBody').innerHTML = '<div class="empty">아직 수집된 데이터가 없습니다 (goatcounter.json)</div>'; });
</script>
</body>
</html>
